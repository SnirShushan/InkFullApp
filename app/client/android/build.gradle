buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Pin plugin modules to API 36. Do not use afterEvaluate here — evaluationDependsOn(':app')
// already evaluates subprojects, so afterEvaluate throws on Codemagic.
subprojects { subproject ->
    subproject.pluginManager.withPlugin("com.android.library") {
        try {
            subproject.android.compileSdk = 36
        } catch (Throwable ignored) {
            try {
                subproject.android.compileSdkVersion = 36
            } catch (Throwable ignored2) {
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
