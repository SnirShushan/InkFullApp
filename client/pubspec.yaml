name: ink
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# iOS App Store / TestFlight: bump +build every upload (must be higher than last build on ASC)
#version: 1.0.85+85 #ios (previous)
version: 1.0.86+86

environment:

  sdk: '>=3.2.0 <4.0.0'
#  sdk: '>=2.18.1 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  #state management
  get: ^4.6.5

  #ui
  carousel_slider: ^5.0.0

  easy_localization: ^3.0.5
  sms_autofill: ^2.4.0


  url_launcher: ^6.1.6
  image_picker: ^0.8.7
  photo_manager: 3.7.1 #^3.8.3

  signature: ^5.3.0
  path_provider:
  flutter_svg: ^1.1.0
  touchable: ^1.0.2
  freezed_annotation: ^2.0.3
  screenshot: ^3.0.0 #android: 2.1.0  #ios: 3.0.0
  shared_preferences:

  share_plus: ^10.0.0
  country_picker: ^2.0.17


#  launch_review: 3.0.1
  #  package_info_plus: ^4.0.0 #package_info_plus: ^3.0.2
#  photo_view:


  # permisssion Handling
  permission_handler:

  #network
  dio: ^4.0.6
  cached_network_image: ^3.4.0 #cached_network_image: ^3.3.1

  #google places

  flutter_google_places_hoc081098: ^2.0.0-beta.0   #flutter_google_places_hoc081098: ^1.0.0-nullsafety.5
#  google_api_headers: ^2.0.0 #google_api_headers: ^1.1.1
  googlemaps_flutter_webservices: ^1.0.2 #  google_maps_webservice: ^0.0.20-nullsafety.5
  google_maps_flutter: ^2.1.1
  geolocator: ^9.0.2
  location:

  #firebase
  firebase_core: ^2.32.0 #New Version Change flutter 3.24 :^3.6.0
  firebase_auth: ^4.20.0  #New Version Change flutter 3.24 :^5.3.1
  firebase_messaging:
  firebase_storage:
  cloud_firestore:
  firebase_dynamic_links: ^5.3.2  #New Version Change flutter 3.24 : 6.0.8

  #notification
  flutter_local_notifications:

  google_sign_in: 6.2.2

  #apple
  sign_in_with_apple: ^6.1.0
  in_app_purchase: ^3.0.1

  pretty_dio_logger:
  connectivity_plus: ^6.0.5

  facebook_app_events: ^0.20.1

  device_info_plus: ^10.1.0



  #OLD Design Plugin
  #pdfx: ^2.6.0
  #shimmer: ^2.0.0
  #webview_flutter: ^4.0.1
  #flutter_staggered_grid_view: ^0.6.2
  #easy_localization: ^3.0.1
  #  uuid:
  #  intl:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.11.0

# Keep GoogleSignIn iOS SDK on 7.x for Firebase iOS 10.25 compatibility
# (GoogleSignIn 8 → AppCheckCore 11 conflicts on GoogleUtilities / RecaptchaInterop).
dependency_overrides:
  google_sign_in_ios: 5.8.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:

  uses-material-design: true

  assets:
    - assets/resources/
    - assets/icons/
    - assets/icons/v2/
    - assets/icons/v2/purchase/
    - assets/icons/v2/dashboard/
    - assets/icons/v2/notification/
    - assets/icons/v2/post_details/
    - assets/icons/v2/collection/
    - assets/images/
    - assets/images/login/
    - assets/svg/
    - assets/images/onboarding/
    - assets/images/changeUserType/

  fonts:
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo-Bold.ttf
        - asset: assets/fonts/Arimo-Medium.ttf
        - asset: assets/fonts/Arimo-Regular.ttf