# Codemagic — Ink Flutter client → TestFlight
# Bundle ID: com.itapp2u.inks | Team: D6F46ZX5U6
#
# One-time in Codemagic UI:
# 1. Teams → Integrations → Developer Portal → Add key named InkAppStoreKey
#    (Key ID + Issuer ID + AuthKey_*.p8)
# 2. Fetch Apple Distribution cert + App Store profile for com.itapp2u.inks
# 3. Start workflow ios-testflight

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: InkAppStoreKey
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.itapp2u.inks
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - name: Get Flutter packages
        script: |
          cd client
          # Prefer CocoaPods for plugins that do not support SPM yet
          flutter config --no-enable-swift-package-manager || true
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd client/ios
          rm -f Podfile.lock
          rm -rf Pods
          pod install --repo-update
          # Meta's FBAudienceNetwork CocoaPods zip often extracts incomplete on CI.
          FAN_XC="Pods/FBAudienceNetwork/Static/FBAudienceNetwork.xcframework"
          if [ -d "Pods/FBAudienceNetwork" ] && [ ! -f "$FAN_XC/Info.plist" ]; then
            echo "Repairing incomplete FBAudienceNetwork.xcframework..."
            curl -fL -o /tmp/FBAudienceNetwork.zip \
              "https://developers.facebook.com/resources/FBAudienceNetwork-6.20.1.zip"
            rm -rf /tmp/FAN_extract
            mkdir -p /tmp/FAN_extract
            unzip -q /tmp/FBAudienceNetwork.zip -d /tmp/FAN_extract
            mkdir -p Pods/FBAudienceNetwork/Static
            if [ -d /tmp/FAN_extract/Static/FBAudienceNetwork.xcframework ]; then
              rm -rf Pods/FBAudienceNetwork/Static
              cp -R /tmp/FAN_extract/Static Pods/FBAudienceNetwork/
            else
              SRC=$(find /tmp/FAN_extract -type d -name 'FBAudienceNetwork.xcframework' | head -n 1)
              test -n "$SRC"
              rm -rf "$FAN_XC"
              cp -R "$SRC" Pods/FBAudienceNetwork/Static/
            fi
            test -f "$FAN_XC/Info.plist"
            echo "FBAudienceNetwork repair OK"
          fi
      - name: Set up code signing
        script: |
          cd client
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd client
          flutter build ipa --release \
            --no-pub \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - client/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - snir.shushan@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
