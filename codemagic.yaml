# Codemagic — Ink Flutter client
# iOS: com.itapp2u.inks → TestFlight
# Android: com.itapp2u.ink → Google Play (internal track)
# Project path in this monorepo: app/client
#
# One-time Codemagic UI secrets (Team / Application → Environment variables):
# Group google_credentials:
#   GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS = full Play Console service-account JSON
# Group keystore_credentials (Android signing):
#   CM_KEYSTORE = base64 of the .jks/.keystore file
#   CM_KEYSTORE_PASSWORD / CM_KEY_PASSWORD / CM_KEY_ALIAS
# Also invite inkapp@pc-api-…iam.gserviceaccount.com in Play Console → Users and permissions.

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: InkAppStoreKey
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.itapp2u.inks
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - name: Get Flutter packages
        script: |
          cd app/client
          flutter config --no-enable-swift-package-manager || true
          flutter pub get
      - name: Install CocoaPods
        script: |
          set -e
          cd app/client/ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update
          find Pods -name 'basic_seq.h' -print0 | while IFS= read -r -d '' SEQ; do
            sed -i.bak 's/Traits::template CallSeqFactory(/Traits::CallSeqFactory(/g' "$SEQ" || true
            echo "patched $SEQ"
          done
      - name: Set up code signing
        script: |
          cd app/client
          xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          cd app/client
          patch_grpc() {
            find ios/Pods -name 'basic_seq.h' -print0 2>/dev/null | while IFS= read -r -d '' SEQ; do
              sed -i.bak 's/Traits::template CallSeqFactory(/Traits::CallSeqFactory(/g' "$SEQ" || true
              echo "patched $SEQ"
            done
          }
          (cd ios && pod install)
          patch_grpc
          if ! flutter build ipa --release --no-pub \
            --export-options-plist=/Users/builder/export_options.plist; then
            echo "Build failed — re-patch gRPC headers and retry once"
            (cd ios && pod install)
            patch_grpc
            flutter build ipa --release --no-pub \
              --export-options-plist=/Users/builder/export_options.plist
          fi
    artifacts:
      - app/client/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - snir.shushan@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-google-play:
    name: Android Google Play
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - google_credentials
        - keystore_credentials
      vars:
        PACKAGE_NAME: com.itapp2u.ink
        CM_KEYSTORE_PATH: /tmp/keystore.keystore
    scripts:
      - name: Set up keystore
        script: |
          set -e
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_KEYSTORE_PATH"
          KEYPROPS="$CM_BUILD_DIR/app/client/android/key.properties"
          printf 'storePassword=%s\n' "$CM_KEYSTORE_PASSWORD" > "$KEYPROPS"
          printf 'keyPassword=%s\n' "$CM_KEY_PASSWORD" >> "$KEYPROPS"
          printf 'keyAlias=%s\n' "$CM_KEY_ALIAS" >> "$KEYPROPS"
          printf 'storeFile=%s\n' "$CM_KEYSTORE_PATH" >> "$KEYPROPS"
      - name: Get Flutter packages
        script: |
          cd app/client
          flutter pub get
      - name: Prepare Android SDK platforms
        script: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
          # Pre-install API 37 and normalize folder name (Codemagic uses android-37.0).
          sdkmanager "platforms;android-37" || true
          if [ -d "$SDK/platforms/android-37.0" ] && [ ! -e "$SDK/platforms/android-37" ]; then
            ln -sfn "android-37.0" "$SDK/platforms/android-37"
            echo "Linked $SDK/platforms/android-37 -> android-37.0"
          fi
          ls -la "$SDK/platforms" || true
      - name: Build App Bundle
        script: |
          set -e
          cd app/client
          flutter build appbundle --release
    artifacts:
      - app/client/build/app/outputs/**/*.aab
      - app/client/build/app/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - snir.shushan@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
