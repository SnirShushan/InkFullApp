# Codemagic — Ink Flutter client → TestFlight
# Bundle ID: com.itapp2u.inks | Team: D6F46ZX5U6
#
# One-time in Codemagic UI:
# 1. Teams → Integrations → Developer Portal → Add key named InkAppStoreKey
#    (Key ID + Issuer ID + AuthKey_*.p8)
# 2. Fetch Apple Distribution cert + App Store profile for com.itapp2u.inks
# 3. Start workflow ios-testflight

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: InkAppStoreKey
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.itapp2u.inks
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - name: Get Flutter packages
        script: |
          cd client
          # Prefer CocoaPods for plugins that do not support SPM yet
          flutter config --no-enable-swift-package-manager || true
          flutter pub get
      - name: Install CocoaPods
        script: |
          set -e
          cd client/ios
          rm -f Podfile.lock
          rm -rf Pods
          pod cache clean FBAudienceNetwork --all || true
          pod install --repo-update
          # post_install in Podfile repairs FAN; assert it exists if the pod is present
          if [ -d Pods/FBAudienceNetwork ]; then
            test -f Pods/FBAudienceNetwork/Static/FBAudienceNetwork.xcframework/Info.plist
            echo "FBAudienceNetwork framework present"
          fi
      - name: Set up code signing
        script: |
          cd client
          xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          cd client
          # config-only + explicit pod install so Podfile post_install repair runs
          # before the archive; flutter build ipa also runs pod install (repair again).
          flutter build ios --config-only --release --no-codesign --no-pub
          (cd ios && pod install)
          if [ -d ios/Pods/FBAudienceNetwork ]; then
            test -f ios/Pods/FBAudienceNetwork/Static/FBAudienceNetwork.xcframework/Info.plist
          fi
          flutter build ipa --release --no-pub \
            --export-options-plist=/Users/builder/export_options.plist
          if [ -d ios/Pods/FBAudienceNetwork ]; then
            test -f ios/Pods/FBAudienceNetwork/Static/FBAudienceNetwork.xcframework/Info.plist \
              || { echo "FAN missing after flutter build pod install"; exit 1; }
          fi
    artifacts:
      - client/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - snir.shushan@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
