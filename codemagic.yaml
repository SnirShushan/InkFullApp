# Codemagic — Ink Flutter client → TestFlight
# Bundle ID: com.itapp2u.inks | Team: D6F46ZX5U6
# Project path in this monorepo: app/client

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: InkAppStoreKey
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.itapp2u.inks
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - name: Get Flutter packages
        script: |
          cd app/client
          flutter config --no-enable-swift-package-manager || true
          flutter pub get
      - name: Install CocoaPods
        script: |
          set -e
          cd app/client/ios
          rm -f Podfile.lock
          rm -rf Pods
          pod install --repo-update
          find Pods -name 'basic_seq.h' -print0 | while IFS= read -r -d '' SEQ; do
            sed -i.bak 's/Traits::template CallSeqFactory(/Traits::CallSeqFactory(/g' "$SEQ" || true
            echo "patched $SEQ"
          done
      - name: Set up code signing
        script: |
          cd app/client
          xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          cd app/client
          patch_grpc() {
            find ios/Pods -name 'basic_seq.h' -print0 2>/dev/null | while IFS= read -r -d '' SEQ; do
              sed -i.bak 's/Traits::template CallSeqFactory(/Traits::CallSeqFactory(/g' "$SEQ" || true
              echo "patched $SEQ"
            done
          }
          (cd ios && pod install)
          patch_grpc
          if ! flutter build ipa --release --no-pub \
            --export-options-plist=/Users/builder/export_options.plist; then
            echo "Build failed — re-patch gRPC headers and retry once"
            (cd ios && pod install)
            patch_grpc
            flutter build ipa --release --no-pub \
              --export-options-plist=/Users/builder/export_options.plist
          fi
    artifacts:
      - app/client/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - snir.shushan@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
