<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ink API</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e8eef4;
      --muted: #8b9aab;
      --ok: #3ecf8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at top, #1a2430 0%, var(--bg) 55%),
        var(--bg);
      color: var(--fg);
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ok);
      display: inline-block;
      margin-right: 0.5rem;
      box-shadow: 0 0 0 0 rgba(62, 207, 142, 0.55);
      animation: pulse 1.6s ease-out infinite;
      vertical-align: middle;
    }
    @keyframes pulse {
      70% { box-shadow: 0 0 0 12px rgba(62, 207, 142, 0); }
      100% { box-shadow: 0 0 0 0 rgba(62, 207, 142, 0); }
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1><span class="dot" aria-hidden="true"></span>API is running</h1>
    <p>Ink backend is up and responding.</p>
  </main>
</body>
</html>
